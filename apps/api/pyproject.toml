[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-os-api"
version = "0.2.0"
description = "Research OS API — AI quantitative research operating system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Quant OS Contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "orjson>=3.10.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "scipy>=1.14.0",
  "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "black>=24.10.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
]
ai = [
  "openai>=1.57.0",
]
security = [
  "cryptography>=43.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_os_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quant_os_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
