# Quant OS — root configuration (non-secret defaults)
# Override with .env for secrets and connection strings.
# UI Settings may override at runtime. Never put API keys here.

app:
  name: "Research OS"
  tagline: "AI Quantitative Research Operating System"
  primary_market: "IN" # ISO-ish market focus; adapters are plugins
  default_timezone: "Asia/Kolkata"
  locale: "en-IN"

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

web:
  port: 3000
  # Set via NEXT_PUBLIC_API_BASE_URL in .env for the browser
  api_base_url: "http://localhost:8000"

database:
  # Prefer DATABASE_URL from environment
  echo_sql: false
  pool_size: 5

duckdb:
  path: "data/analytics/quant_os.duckdb"

storage:
  parquet_root: "data/parquet"
  artifacts_root: "artifacts"

redis:
  # Prefer REDIS_URL from environment
  default_queue: "quant_os"

celery:
  task_always_eager: false

ai:
  default_provider: "openai_compatible"
  default_model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 4096
  # Provider endpoints/keys come from env:
  # AI_OPENAI_COMPATIBLE_BASE_URL, AI_OPENAI_COMPATIBLE_API_KEY, etc.
  providers:
    openai_compatible:
      enabled: true
    local:
      enabled: false
      base_url: "http://localhost:11434/v1"

data_providers:
  default: "fixture"
  providers:
    nse_historical:
      enabled: true
      # package.module.ClassName — swappable without code edits to callers
      module: "quant_os_api.plugins.data.nse_historical.NSEHistoricalProvider"
    bse_historical:
      enabled: true
      module: "quant_os_api.plugins.data.bse_historical.BSEHistoricalProvider"
    fixture:
      enabled: true
      module: "quant_os_api.plugins.data.fixture.FixtureDataProvider"

brokers:
  default: "paper"
  providers:
    paper:
      enabled: true
      module: "quant_os_api.plugins.brokers.paper.PaperBroker"

backtest:
  default_initial_cash: 1000000
  default_currency: "INR"
  fee_bps: 3.0
  slippage_bps: 2.0
  tax_enabled: true

validation:
  require_walk_forward: true
  require_out_of_sample: true
  min_reproducibility_score: 0.7

features:
  ai_loop_enabled: true
  marketplace_enabled: false
  notebook_enabled: true
  live_data_enabled: false

logging:
  level: "INFO"
  json: false

ui:
  theme: "dark"
  glassmorphism: false
  density: "comfortable"
