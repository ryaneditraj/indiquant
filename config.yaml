# Indiquant — configuration (non-secret defaults)
# Product of Money Radar (moneyradar.in) · Thugir Group
# Override secrets via .env. Never put API keys here.

app:
  name: "Indiquant"
  tagline: "AI quant research OS for Indian markets"
  short_description: "Open-source evidence-first quant research OS for NSE/BSE — hypothesis, backtest, walk-forward proof. Not a trading bot."
  parent_brand: "Money Radar"
  parent_url: "https://moneyradar.in"
  organization: "Thugir Group"
  primary_market: "IN"
  default_timezone: "Asia/Kolkata"
  locale: "en-IN"
  github_url: "https://github.com/ryaneditraj/indiquant"
  seo_keywords:
    - Indian stock market research
    - NSE BSE quant research
    - AI trading strategy discovery
    - walk-forward backtesting India
    - open source quant OS
    - Money Radar Indiquant
    - Thugir Group fintech

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "https://moneyradar.in"
    - "https://www.moneyradar.in"

web:
  port: 3000
  api_base_url: "http://localhost:8000"
  site_url: "https://moneyradar.in/indiquant"

database:
  echo_sql: false
  pool_size: 5

duckdb:
  path: "data/analytics/indiquant.duckdb"

storage:
  parquet_root: "data/parquet"
  artifacts_root: "artifacts"

redis:
  default_queue: "indiquant"

celery:
  task_always_eager: false
  # Beat schedule is defined in quant_os_api.workers (Sunday 02:30 Asia/Kolkata).
  # Task: quant_os.trends_collect_all → per-entity quant_os.trends_collect
  # Cron alternative without Redis: make trends-collect-all  (see docs/trends.md)

ai:
  default_provider: "openai_compatible"
  default_model: "gpt-4o-mini"
  temperature: 0.2
  max_tokens: 4096
  providers:
    openai_compatible:
      enabled: true
    local:
      enabled: false
      base_url: "http://localhost:11434/v1"

data_providers:
  default: "fixture"
  providers:
    nse_historical:
      enabled: true
      module: "quant_os_api.plugins.data.nse_historical.NSEHistoricalProvider"
    bse_historical:
      enabled: true
      module: "quant_os_api.plugins.data.bse_historical.BSEHistoricalProvider"
    fixture:
      enabled: true
      module: "quant_os_api.plugins.data.fixture.FixtureDataProvider"
    csv_local:
      enabled: true
      module: "quant_os_api.plugins.data.csv_local.CSVLocalProvider"

brokers:
  default: "paper"
  providers:
    paper:
      enabled: true
      module: "quant_os_api.plugins.brokers.paper.PaperBroker"

backtest:
  default_initial_cash: 1000000
  default_currency: "INR"
  fee_bps: 3.0
  slippage_bps: 2.0
  tax_enabled: true

validation:
  require_walk_forward: true
  require_out_of_sample: true
  min_reproducibility_score: 0.7

features:
  ai_loop_enabled: true
  marketplace_enabled: false
  notebook_enabled: true
  live_data_enabled: false
  auto_seed_on_boot: true
  google_trends_enabled: true

# Google Trends Intelligence — relative 0–100 index, NOT absolute volume.
# Always use shared windows + anchors; never compare separate exports naïvely.
google_trends:
  geo: "IN"
  timezone: "Asia/Kolkata"
  default_provider: "fixture"  # fixture | pytrends
  collect_repeats: 3           # average repeated pulls (sampling noise)
  pytrends_retries: 3         # exponential backoff on 429 / transient errors
  pytrends_backoff_sec: 2.0
  pytrends_request_gap_sec: 1.0
  windows:
    - "30d"
    - "90d"
    - "12m"
    - "5y"
  pull_frequencies:
    daily: false
    weekly: true
  anchors:
    fixed:
      - "news"
      - "weather"
    category:
      - "online grocery"
    competitor_basket: true
  entities:
    dmart:
      label: "DMart"
      ticker: "DMART"
      exchange: "NSE"
      parent: "Avenue Supermarts"
      earnings_calendar:
